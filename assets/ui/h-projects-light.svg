<svg xmlns="http://www.w3.org/2000/svg" width="830" height="62" viewBox="0 0 830 62" fill="none"><style>text{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.in{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}.blink{animation:blink 1s steps(1) infinite}@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.blink{animation:none}}</style><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B45E6"/><stop offset="1" stop-color="#0891B2"/></linearGradient><linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B45E6" stop-opacity="0"/><stop offset=".5" stop-color="#0891B2"/><stop offset="1" stop-color="#5B45E6" stop-opacity="0"/></linearGradient></defs><rect x="0" y="12" width="5" height="30" rx="2.5" fill="url(#g)"/><text x="20" y="36" font-size="26" font-weight="800" fill="#1b2130" letter-spacing="-0.5">Featured projects</text><text x="830" y="35" text-anchor="end" font-size="13" fill="#5a6478">Selected work, click through to see them live</text><line x1="0" y1="55" x2="830" y2="55" stroke="#d8deea"/><rect x="-160" y="54" width="160" height="2" rx="1" fill="url(#sh)"><animate attributeName="x" from="-160" to="830" dur="4.5s" repeatCount="indefinite"/></rect></svg>