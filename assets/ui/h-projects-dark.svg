<svg xmlns="http://www.w3.org/2000/svg" width="830" height="158" viewBox="0 0 830 158" fill="none"><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Inter','Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif}.m{font-family:'SF Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes in{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.in{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:in 1s cubic-bezier(.16,1,.3,1) forwards}.blink{animation:blink 1.05s steps(1) infinite}@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.blink{animation:none}}</style><defs><linearGradient id="hs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A84FF" stop-opacity="0"/><stop offset=".5" stop-color="#0A84FF"/><stop offset="1" stop-color="#5E5CE6" stop-opacity="0"/></linearGradient></defs><g transform="translate(0 58)"><text x="2" y="30" font-size="12" font-weight="700" letter-spacing="2.4" fill="#0A84FF">05  ·  FEATURED PROJECTS</text><text x="0" y="72" font-size="32" font-weight="700" letter-spacing="-1" fill="#F5F5F7">Featured projects</text><text x="830" y="70" text-anchor="end" font-size="13.5" fill="#6E6E73">Selected work, click any card to open it live</text><line x1="0" y1="90" x2="830" y2="90" stroke="#FFFFFF" stroke-opacity="0.1"/><rect x="-220" y="89" width="220" height="2" rx="1" fill="url(#hs)"><animate attributeName="x" from="-220" to="830" dur="5s" repeatCount="indefinite"/></rect></g></svg>