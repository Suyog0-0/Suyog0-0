name: Refresh GitHub stats card

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:         # run it manually from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render streak card from public contribution data
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_stats.py

      - name: Commit refreshed SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats
          git diff --cached --quiet || git commit -m "chore: refresh stats card [skip ci]"
          git push
